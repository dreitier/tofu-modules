# terraform-docs for every module (pre-commit hook terraform-docs-go): writes inputs and outputs into
# modules/<module>/README.md between the BEGIN_TF_DOCS/END_TF_DOCS markers. Title and description above the
# markers are written by hand. Same setup as 50hertz/terraform-modules.
formatter: "markdown table"
version: "~> 0.25.0"

header-from: main.tf # unused: sections.show has no header
footer-from: ""

recursive:
  enabled: true
  path: modules
  include-main: false

sections:
  show:
    - inputs
    - outputs

content: ""

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

output-values:
  enabled: false
  from: ""

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: false
  default: true
  description: false
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
