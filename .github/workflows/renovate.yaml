---
# Renovate for this repository: weekly, or by hand (Actions → Renovate → Run workflow). Runs as the org-owned
# Renovate GitHub App (variable RENOVATE_APP_CLIENT_ID, secret RENOVATE_APP_PRIVATE_KEY – set on the
# repository like in basement, docs/renovate.md there); the installation token is minted per run.
name: Renovate

on:
  schedule:
    - cron: "47 4 * * 1"  # Mondays 04:47 UTC
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774  # v46.3.14
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: info
        with:
          token: ${{ steps.app.outputs.token }}
